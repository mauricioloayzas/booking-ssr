service: clichin-booking-ssr

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 15
  versionFunctions: false
  environment:
    NUXT_PUBLIC_API_AUTH_BASE: ${self:custom.apiAuthBase.${sls:stage}}
    NUXT_PUBLIC_API_APOTHECA_BASE: ${self:custom.apiApothecaBase.${sls:stage}}
    NUXT_PUBLIC_API_PROFESSIONALIS_BASE: ${self:custom.apiProfessionalisBase.${sls:stage}}
    NUXT_PUBLIC_API_COLLECTOR_BASE: ${self:custom.apiCollectorBase.${sls:stage}}
    NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${env:RECAPTCHA_SITE_KEY, ''}
    NUXT_PUBLIC_SITE_URL: ${self:custom.siteUrl.${sls:stage}}
    # NUXT_APP_CDN_URL es build-time (se pasa al correr `npm run build`, no al runtime del Lambda)

custom:
  # Mismas API Gateways que ya usa caja-registradora/frontend — estos endpoints públicos
  # nuevos (/public/...) viven en los backends existentes, no en un backend aparte.
  apiAuthBase:
    dev: https://0dpp2nb3rd.execute-api.us-east-1.amazonaws.com
    prod: https://qbjvrgskk7.execute-api.us-east-1.amazonaws.com
  apiApothecaBase:
    dev: https://spngyrrbc4.execute-api.us-east-1.amazonaws.com
    prod: https://CAMBIAR-apotheca-prod.execute-api.us-east-1.amazonaws.com
  apiProfessionalisBase:
    dev: https://ag1e72jvr7.execute-api.us-east-1.amazonaws.com
    prod: https://CAMBIAR-professionalis-prod.execute-api.us-east-1.amazonaws.com
  apiCollectorBase:
    dev: https://sja0cciay0.execute-api.us-east-1.amazonaws.com
    prod: https://CAMBIAR-collector-prod.execute-api.us-east-1.amazonaws.com
  siteUrl:
    dev: https://dev.clichin.com
    prod: https://clichin.com

  # Bucket S3 donde se sincronizan los assets del build (.output/public/) después de cada deploy
  assetsBucket:
    dev: clichin-booking-assets-dev
    prod: clichin-booking-assets-prod

functions:
  nuxt:
    handler: .output/server/index.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

plugins:
  - serverless-offline

package:
  patterns:
    - '!**'
    - '.output/server/**'

resources:
  Resources:
    BookingAssetsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.assetsBucket.${sls:stage}}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerPreferred
        WebsiteConfiguration:
          IndexDocument: index.html
    BookingAssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BookingAssetsBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: 's3:GetObject'
              Resource: !Sub '${BookingAssetsBucket.Arn}/*'
