service: clichin-booking-ssr

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 15
  versionFunctions: false
  environment:
    NUXT_PUBLIC_API_AUTH_BASE: ${self:custom.apiAuthBase.${sls:stage}}
    NUXT_PUBLIC_API_APOTHECA_BASE: ${self:custom.apiApothecaBase.${sls:stage}}
    NUXT_PUBLIC_API_PROFESSIONALIS_BASE: ${self:custom.apiProfessionalisBase.${sls:stage}}
    NUXT_PUBLIC_API_COLLECTOR_BASE: ${self:custom.apiCollectorBase.${sls:stage}}
    NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${env:RECAPTCHA_SITE_KEY, ''}
    NUXT_PUBLIC_SITE_URL: ${self:custom.siteUrl.${sls:stage}}
    # NUXT_APP_CDN_URL es build-time (se pasa al correr `npm run build`, no al runtime del Lambda)

custom:
  # Mismas API Gateways que ya usa caja-registradora/frontend — estos endpoints públicos
  # nuevos (/public/...) viven en los backends existentes, no en un backend aparte.
  apiAuthBase:
    dev: https://0dpp2nb3rd.execute-api.us-east-1.amazonaws.com
    prod: https://qbjvrgskk7.execute-api.us-east-1.amazonaws.com
  apiApothecaBase:
    dev: https://spngyrrbc4.execute-api.us-east-1.amazonaws.com
    prod: https://meuguwhm6j.execute-api.us-east-1.amazonaws.com
  apiProfessionalisBase:
    dev: https://ag1e72jvr7.execute-api.us-east-1.amazonaws.com
    prod: https://e02k3i49jc.execute-api.us-east-1.amazonaws.com
  apiCollectorBase:
    dev: https://sja0cciay0.execute-api.us-east-1.amazonaws.com
    prod: https://6rds6jb9ok.execute-api.us-east-1.amazonaws.com
  siteUrl:
    dev: https://dev.agenda.clichin.app
    prod: https://agenda.clichin.app

  # Bucket S3 donde se sincronizan los assets del build (.output/public/) después de cada deploy
  assetsBucket:
    dev: clichin-booking-assets-dev
    prod: clichin-booking-assets-prod

functions:
  nuxt:
    handler: .output/server/index.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY

plugins:
  - serverless-offline

package:
  patterns:
    - '!**'
    - '.output/server/**'

resources:
  Conditions:
    # agenda.clichin.app solo se conecta en prod (certificado ACM ya validado);
    # dev sigue usando únicamente la URL cruda de execute-api.
    IsProd: !Equals ['${sls:stage}', 'prod']

  Resources:
    AgendaDomainName:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: IsProd
      Properties:
        DomainName: agenda.clichin.app
        DomainNameConfigurations:
          - CertificateArn: arn:aws:acm:us-east-1:996197173188:certificate/341228c3-3ef9-4cdd-8c3a-7dc6de98b84a
            EndpointType: REGIONAL

    AgendaApiMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: IsProd
      Properties:
        ApiId: !Ref HttpApi
        DomainName: !Ref AgendaDomainName
        Stage: !Ref HttpApiStage

    BookingAssetsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.assetsBucket.${sls:stage}}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerPreferred
        WebsiteConfiguration:
          IndexDocument: index.html
    BookingAssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BookingAssetsBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: 's3:GetObject'
              Resource: !Sub '${BookingAssetsBucket.Arn}/*'

  Outputs:
    AgendaRegionalDomainName:
      Condition: IsProd
      Value: !GetAtt AgendaDomainName.RegionalDomainName
    AgendaRegionalHostedZoneId:
      Condition: IsProd
      Value: !GetAtt AgendaDomainName.RegionalHostedZoneId
